<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FitFour</title>
  <meta name="description" content="A 4-day gym program to lose fat and build muscle — with form videos, macro targets, and progress tracking." />

  <meta name="theme-color" content="#08080C" id="themeColorMeta" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FitFour" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone">
    <header class="appbar" id="appbar"></header>
    <main class="screen" id="screen"></main>
    <div class="rest-timer" id="restTimer" hidden></div>
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  </div>

  <div class="sheet-wrap" id="sheetWrap" hidden>
    <div class="sheet-backdrop" data-sheet-close></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <script src="workouts.js"></script>
  <script src="icons.js"></script>
  <script src="profile.js"></script>
  <script src="app.js"></script>
</body>
</html>
